<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        * {
            font-size: 12px;
            font-family: 'Times New Roman';
        }

        td,
        th,
        tr,
        table {
            border-top: 1px solid black;
            border-collapse: collapse;
        }

        td.description,
        th.description {
            width: 75px;
            max-width: 75px;
        }

        td.quantity,
        th.quantity {
            width: 40px;
            max-width: 40px;
            word-break: break-all;
        }

        td.price,
        th.price {
            width: 40px;
            max-width: 40px;
            word-break: break-all;
        }

        .centered {
            text-align: center;
            align-content: center;
        }

        .ticket {
            width: 155px;
            max-width: 155px;
        }

        img {
            max-width: inherit;
            width: inherit;
        }

        @media print {
            .hidden-print,
            .hidden-print * {
                display: none !important;
            }
        }
    </style>
</head>
<body>


<button onclick="print()">Print</button>


<script>
   function print(){
      let html = '' +
          "<style>\n" +
          "        * {\n" +
          "            font-size: 12px;\n" +
          "            font-family: 'Times New Roman';\n" +
          "        }\n" +
          "\n" +
          "        td,\n" +
          "        th,\n" +
          "        tr,\n" +
          "        table {\n" +
          "            border-top: 1px solid black;\n" +
          "            border-collapse: collapse;\n" +
          "        }\n" +
          "\n" +
          "        td.description,\n" +
          "        th.description {\n" +
          "            width: 75px;\n" +
          "            max-width: 75px;\n" +
          "        }\n" +
          "\n" +
          "        td.quantity,\n" +
          "        th.quantity {\n" +
          "            width: 40px;\n" +
          "            max-width: 40px;\n" +
          "            word-break: break-all;\n" +
          "        }\n" +
          "\n" +
          "        td.price,\n" +
          "        th.price {\n" +
          "            width: 40px;\n" +
          "            max-width: 40px;\n" +
          "            word-break: break-all;\n" +
          "        }\n" +
          "\n" +
          "        .centered {\n" +
          "            text-align: center;\n" +
          "            align-content: center;\n" +
          "        }\n" +
          "\n" +
          "        .ticket {\n" +
          "            width: 155px;\n" +
          "            max-width: 155px;\n" +
          "        }\n" +
          "\n" +
          "        img {\n" +
          "            max-width: inherit;\n" +
          "            width: inherit;\n" +
          "        }\n" +
          "\n" +
          "        @media print {\n" +
          "            .hidden-print,\n" +
          "            .hidden-print * {\n" +
          "                display: none !important;\n" +
          "            }\n" +
          "        }\n" +
          "    </style>\n" +
          '<div class="ticket">\n' +
          '            <p class="centered">RECEIPT EXAMPLE\n' +
          '                <br>Address line 1\n' +
          '                <br>Address line 2</p>\n' +
          '            <table>\n' +
          '                <thead>\n' +
          '                    <tr>\n' +
          '                        <th class="quantity">Q.</th>\n' +
          '                        <th class="description">Description</th>\n' +
          '                        <th class="price">$$</th>\n' +
          '                    </tr>\n' +
          '                </thead>\n' +
          '                <tbody>\n' +
          '                    <tr>\n' +
          '                        <td class="quantity">1.00</td>\n' +
          '                        <td class="description">ARDUINO UNO R3</td>\n' +
          '                        <td class="price">$25.00</td>\n' +
          '                    </tr>\n' +
          '                    <tr>\n' +
          '                        <td class="quantity">2.00</td>\n' +
          '                        <td class="description">JAVASCRIPT BOOK</td>\n' +
          '                        <td class="price">$10.00</td>\n' +
          '                    </tr>\n' +
          '                    <tr>\n' +
          '                        <td class="quantity">1.00</td>\n' +
          '                        <td class="description">STICKER PACK</td>\n' +
          '                        <td class="price">$10.00</td>\n' +
          '                    </tr>\n' +
          '                    <tr>\n' +
          '                        <td class="quantity"></td>\n' +
          '                        <td class="description">TOTAL</td>\n' +
          '                        <td class="price">$55.00</td>\n' +
          '                    </tr>\n' +
          '                </tbody>\n' +
          '            </table>\n' +
          '            <p class="centered">Thanks for your purchase!\n' +
          '                <br>parzibyte.me/blog</p>\n' +
          '        </div>'
      printHtml(html)
    }

    const printHtml = async (html) => {
        const printable = window.open('', '_blank', 'fullscreen=no');
        printable.document.open();
        printable.document.write(`<html><body onload="window.print()">${html}</body></html>`);
        await printable.print();
        printable.close();
    };


</script>
</body>
</html>
