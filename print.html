<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

</head>
<body>

<button onclick="printNewWindow()">Print new window</button>
<button onclick="printLocal()">Print this</button>

<script>
    let html = '' +
        "<style>\n" +
        "        * {\n" +
        "            font-size: 12px;\n" +
        "            font-family: 'Times New Roman';\n" +
        "        }\n" +
        "\n" +
        "        td,\n" +
        "        th,\n" +
        "        tr,\n" +
        "        table {\n" +
        "            border-top: 1px solid black;\n" +
        "            border-collapse: collapse;\n" +
        "        }\n" +
        "\n" +
        "        td.description,\n" +
        "        th.description {\n" +
        "            width: 75px;\n" +
        "            max-width: 75px;\n" +
        "        }\n" +
        "\n" +
        "        td.quantity,\n" +
        "        th.quantity {\n" +
        "            width: 40px;\n" +
        "            max-width: 40px;\n" +
        "            word-break: break-all;\n" +
        "        }\n" +
        "\n" +
        "        td.price,\n" +
        "        th.price {\n" +
        "            width: 40px;\n" +
        "            max-width: 40px;\n" +
        "            word-break: break-all;\n" +
        "        }\n" +
        "\n" +
        "        .centered {\n" +
        "            text-align: center;\n" +
        "            align-content: center;\n" +
        "        }\n" +
        "\n" +
        "        .ticket {\n" +
        "            width: 155px;\n" +
        "            max-width: 155px;\n" +
        "        }\n" +
        "\n" +
        "        img {\n" +
        "            max-width: inherit;\n" +
        "            width: inherit;\n" +
        "        }\n" +
        "\n" +
        "        @media print {\n" +
        "            .hidden-print,\n" +
        "            .hidden-print * {\n" +
        "                display: none !important;\n" +
        "            }\n" +
        "        }\n" +
        "    </style>\n" +
        '<div class="ticket">\n' +
        '            <p class="centered">RECEIPT EXAMPLE\n' +
        '                <br>Address line 1\n' +
        '                <br>Address line 2</p>\n' +
        '            <table>\n' +
        '                <thead>\n' +
        '                    <tr>\n' +
        '                        <th class="quantity">Q.</th>\n' +
        '                        <th class="description">Description</th>\n' +
        '                        <th class="price">$$</th>\n' +
        '                    </tr>\n' +
        '                </thead>\n' +
        '                <tbody>\n' +
        '                    <tr>\n' +
        '                        <td class="quantity">1.00</td>\n' +
        '                        <td class="description">ARDUINO UNO R3</td>\n' +
        '                        <td class="price">$25.00</td>\n' +
        '                    </tr>\n' +
        '                    <tr>\n' +
        '                        <td class="quantity">2.00</td>\n' +
        '                        <td class="description">JAVASCRIPT BOOK</td>\n' +
        '                        <td class="price">$10.00</td>\n' +
        '                    </tr>\n' +
        '                    <tr>\n' +
        '                        <td class="quantity">1.00</td>\n' +
        '                        <td class="description">STICKER PACK</td>\n' +
        '                        <td class="price">$10.00</td>\n' +
        '                    </tr>\n' +
        '                    <tr>\n' +
        '                        <td class="quantity"></td>\n' +
        '                        <td class="description">TOTAL</td>\n' +
        '                        <td class="price">$55.00</td>\n' +
        '                    </tr>\n' +
        '                </tbody>\n' +
        '            </table>\n' +
        '            <p class="centered">Thanks for your purchase!\n' +
        '                <br>parzibyte.me/blog</p>\n' +
        '        </div>'

   function printNewWindow(){
      printHtml(html)
    }

    function printLocal(){
         this.print();
    }
    document.body.innerHTML =  html  +"<br><br>"+ document.body.innerHTML;

    const printHtml = async (html) => {
        const printable = window.open('', '_blank', 'fullscreen=no');
        printable.document.open();
        printable.document.write(`<html><body onload="window.print()">${html}</body></html>`);
        await printable.print();

        printable.onfocus = (e) => {
            printable.close();
        }
        // printable.close();
    };


</script>
</body>
